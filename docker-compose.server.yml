services:
  solace-review:
    image: nginx:alpine
    container_name: solace-review
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
